<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Random User</title>

    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 40px;
        background: #f5f5f5;
      }

      #card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        width: 250px;
        text-align: center;
      }

      #avatar {
        border-radius: 50%;
        margin-bottom: 15px;
      }

      button {
        margin-top: 15px;
        padding: 10px 20px;
        border: none;
        background: #4a90e2;
        color: white;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      button:hover {
        background: #357ABD;
      }

      #spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #4a90e2;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        margin: 10px auto;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .hidden {
        display: none;
      }

      #users {
        margin-top: 30px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .user-card {
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        width: 200px;
        text-align: center;
      }

      .user-card img {
        border-radius: 50%;
      }
    </style>
  </head>

  <body>
    <div id="card">
      <h1>Random User</h1>
      <div id="spinner" class="hidden"></div>
      <img id="avatar" width="120">
      <p id="username">No one yet</p>
      <div id="info"></div>
      <button id="btn">Get User</button>
      <button id="multi-btn">Get 5 Users</button>
    </div>

    <div id="users"></div>

    <script>
      const btn = document.getElementById("btn");
      const multiBtn = document.getElementById("multi-btn");
      const username = document.getElementById("username");
      const avatar = document.getElementById("avatar");
      const info = document.getElementById("info");
      const spinner = document.getElementById("spinner");
      const usersContainer = document.getElementById("users");

      async function getRandomUser() {
        const response = await fetch("https://randomuser.me/api/");
        const data = await response.json();
        return data.results[0];
      }

      // ====== SINGLE USER BUTTON ======
      btn.addEventListener("click", async () => {
        username.innerText = "Loading...";
        avatar.src = "";
        info.innerHTML = "";
        spinner.classList.remove("hidden");

        try {
          const user = await getRandomUser();

          username.innerText = `${user.name.first} ${user.name.last}`;
          avatar.src = user.picture.large;

          info.innerHTML = `
            <p>Email: ${user.email}</p>
            <p>Age: ${user.dob.age}</p>
            <p>Country: ${user.location.country}</p>
            <p>City: ${user.location.city}</p>
          `;
        } catch (error) {
          username.innerText = "Error loading user";
          info.innerHTML = "<p>Please try again later.</p>";
        }

        spinner.classList.add("hidden");
      });

      // ====== MULTIPLE USERS BUTTON ======
      multiBtn.addEventListener("click", async () => {
        usersContainer.innerHTML = ""; // clear previous results

        for (let i = 0; i < 5; i++) {
          const user = await getRandomUser();
          createUserCard(user);
        }
      });

      function createUserCard(user) {
        const card = document.createElement("div");
        card.classList.add("user-card");

        card.innerHTML = `
          <img src="${user.picture.medium}" alt="Avatar">
          <h3>${user.name.first} ${user.name.last}</h3>
          <p>Email: ${user.email}</p>
          <p>Age: ${user.dob.age}</p>
          <p>${user.location.country}</p>
          <p>${user.location.city}</p>
        `;

        usersContainer.appendChild(card);
      }
    </script>
  </body>
</html>
