<html>
    <head>
        <meta charset="UTF-8">
        <title>Random User</title>
            <style>
                body {
                    font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
                    background: #f8f9fa;
                    margin: 0;
                    padding: 0;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    min-height: 100vh;
                }
                h1 {
                    margin-top: 60px;
                    font-size: 2rem;
                    color: #222;
                    letter-spacing: 1px;
                }
                #username {
                    margin: 24px 0 16px 0;
                    font-size: 1.1rem;
                    color: #555;
                    background: #fff;
                    padding: 10px 24px;
                    border-radius: 8px;
                    box-shadow: 0 1px 4px rgba(0,0,0,0.04);
                }
                #btn {
                    padding: 10px 28px;
                    font-size: 1rem;
                    border: none;
                    border-radius: 8px;
                    background: #222;
                    color: #fff;
                    cursor: pointer;
                    transition: background 0.2s;
                }
                #btn:hover {
                    background: #444;
                }
            </style>
    </head>

    <body>
        
    
<h1>Random User</h1>
<p id="username">No User yet</p>
<button id="btn">Get User</button>
    
<script>
    const btn = document.getElementById("btn")
    const username = document.getElementById("username")

    btn.addEventListener("click", () => {
        username.innerText = "Loading..."
        username.style.color = "green"
    })
</script>
</body>
</html>
